# MakerBot Replicator Z18 - Klipper, stage 1: motor test
#
# Board: BTT Octopus Pro V1.1 (STM32H723), firmware per klipper/firmware/octopus-pro-h723.config
# Pins: ~/klipper/config/generic-bigtreetech-octopus-pro-v1.1.cfg (Klipper v0.13.0-816-gee2c6fb6)
#
# NO heaters, NO endstops in use - intended only for STEPPER_BUZZ / DUMP_TMC.
# Do not home and do not print with this config.
# Placeholders marked "PLACEHOLDER" must be replaced with verified values.

# Mainsail macros and virtual_sdcard (~/printer_data/config/mainsail.cfg, installed by KIAUH)
[include mainsail.cfg]

[mcu]
# Octopus Pro runs in "USB to CAN bus bridge" mode -> no serial device.
# Find UUID with: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_uuid: 479eb403415a  # canbus_query.py can0, 2026-11-14

# BTT EBB36 CAN V1.2 toolhead board (STM32G0B1), Katapult + Klipper over CAN,
# firmware per klipper/firmware/ebb36-v1.2.config. No heater/fan/probe yet.
# Pins: ~/klipper/config/sample-bigtreetech-ebb-canbus-v1.2.cfg
[mcu EBB]
canbus_uuid: b5a6d84ff699  # canbus_query.py can0, 2026-11-19

[printer]
# Z18 head motion is H-bot (both motors drive one belt); Klipper handles
# H-bot with corexy kinematics (config/example-corexy.cfg)
kinematics: corexy
# Conservative limits for testing only
max_velocity: 50
max_accel: 500
max_z_velocity: 5
max_z_accel: 50

# Test only: FORCE_MOVE moves a single stepper without homing
# (docs/G-Codes.md, [force_move]); remove once endstops are configured
[force_move]
enable_force_move: True

# Sensorless homing sequence (TMC_Drivers.md, "Tips for sensorless homing on
# CoreXY"): reduced current, 2 s pause to clear the stall flag, home one axis,
# move away from the stop, then the other axis. Homing current 0.4 A is the
# value driver_SGT was tuned at - retune driver_SGT if it changes.
[homing_override]
axes: xyz
gcode:
    {% set HOME_CUR = 0.4 %}
    {% set RUN_X = printer.configfile.settings['tmc5160 stepper_x'].run_current %}
    {% set RUN_Y = printer.configfile.settings['tmc5160 stepper_y'].run_current %}
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% if 'Z' in params %}
    RESPOND TYPE=error MSG="Z homing not configured yet"
    {% endif %}
    {% if home_all or 'X' in params or 'Y' in params %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    {% if home_all or 'X' in params %}
    G4 P2000
    G28 X
    G91
    G1 X-15 F1200
    G90
    {% endif %}
    {% if home_all or 'Y' in params %}
    G4 P2000
    G28 Y
    G91
    G1 Y-15 F1200
    G90
    {% endif %}
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_X}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_Y}
    {% endif %}

# Driver0 slot - H-bot motor labelled "H" on the machine
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 36  # 2026-11-14: 200 mm moves at 34.8 gave X 208 / Y 207 mm (ruler) -> ~36.1 = GT2 18T; teeth count unverified (docs/test-motoru.md)
# Sensorless homing - Z18 has no endstop switches (user, 2026-11-14);
# setup per ~/klipper/docs/TMC_Drivers.md "Sensorless Homing"
endstop_pin: tmc5160_stepper_x:virtual_endstop
homing_retract_dist: 0
# rotation_distance / 2 (TMC_Drivers.md starting point)
homing_speed: 18
# Home to the right like the original Z18 (user). Travel 308 mm measured by
# hand (user, 2026-11-14); endstop 3 mm short of it keeps 3 mm off the left stop
homing_positive_dir: true
position_endstop: 305
position_max: 305
position_min: 0

# Driver1 slot - H-bot motor labelled "V" on the machine
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 36  # 2026-11-14: 200 mm moves at 34.8 gave X 208 / Y 207 mm (ruler) -> ~36.1 = GT2 18T; teeth count unverified (docs/test-motoru.md)
# Sensorless homing - Z18 has no endstop switches (user, 2026-11-14);
# setup per ~/klipper/docs/TMC_Drivers.md "Sensorless Homing"
endstop_pin: tmc5160_stepper_y:virtual_endstop
homing_retract_dist: 0
# rotation_distance / 2 (TMC_Drivers.md starting point)
homing_speed: 18
# Home to the back like the original Z18 (user). Travel 325 mm measured by
# hand (user, 2026-11-14); endstop 3 mm short of it keeps 3 mm off the front stop
homing_positive_dir: true
position_endstop: 322
position_max: 322
position_min: 0

# Driver2 slot
[stepper_z]
step_pin: PF11
# Inverted 2026-11-19: positive FORCE_MOVE lifted the bed; Klipper +Z = bed away from nozzle
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 1.2  # 2026-11-19: gauge tests gave 1.206 (250 mm at 8 -> 37.69 mm) and 1.194 (30 mm at 1.206 -> 29.71 mm); mean 1.2 - e.g. 2 mm pitch with 3:5 belt ratio, unverified (docs/test-motoru.md)
endstop_pin: ^PG10  # PLACEHOLDER
position_endstop: 0
position_max: 450  # PLACEHOLDER

# Driver3 slot: spare TMC5160T, not configured

# TMC5160T Pro V1.0: sense resistor 0.075 ohm, max 3.1 A RMS
# (source: https://global.bttwiki.com/TMC5160T%20Pro%20V1.0.html)
# SPI pins: Octopus Pro v1.1 sample config (TMC2130 section, same SPI wiring)
# run_current: low test values (see docs/hardware.md)

[tmc5160 stepper_x]
# Octopus Pro V1.1 M0DIAG jumper -> PG6 (BIGTREETECH Octopus Pro V1.1-Pin.jpg)
diag1_pin: ^!PG6
# Tuned 2026-11-14 at homing_speed 18, 0.4 A: 0-1 false trigger, 2-4 home with
# single touch, 5+ no trigger -> 4 + (2 - 4) / 3 ~ 3 (TMC_Drivers.md); 5 of 5 homes OK
driver_SGT: 3
cs_pin: PC4
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.8  # ceiling from catalog sibling 17HD6017N (unverified, docs/hardware.md); 5 min motion test OK 2026-11-14 (docs/test-motoru.md)

[tmc5160 stepper_y]
# Octopus Pro V1.1 M1DIAG jumper -> PG9 (BIGTREETECH Octopus Pro V1.1-Pin.jpg)
diag1_pin: ^!PG9
# Tuned 2026-11-14 at homing_speed 18, 0.4 A: 1 false trigger, 2-3 home with
# single touch, 4+ no trigger -> 3 + (2 - 3) / 3 ~ 3 (TMC_Drivers.md); 5 of 5 homes OK
driver_SGT: 3
cs_pin: PD11
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.8  # see stepper_x

# Driver fitted in Driver2 slot 2026-11-19 (user); Driver3 holds the spare, not configured
[tmc5160 stepper_z]
# CS pin: Octopus Pro v1.1 sample config ([tmc2130 stepper_z])
cs_pin: PC6
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.35  # PLACEHOLDER - Z label inaccessible, same 7.5 ohm coil as H/V, assume max 0.8 A
