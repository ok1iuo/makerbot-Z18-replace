# MakerBot Replicator Z18 - Klipper, stage 1: motor test
#
# Board: BTT Octopus Pro V1.1 (STM32H723), firmware per klipper/firmware/octopus-pro-h723.config
# Pins: ~/klipper/config/generic-bigtreetech-octopus-pro-v1.1.cfg (Klipper v0.13.0-816-gee2c6fb6)
#
# NO heaters, NO endstops in use - intended only for STEPPER_BUZZ / DUMP_TMC.
# Do not home and do not print with this config.
# Placeholders marked "PLACEHOLDER" must be replaced with verified values.

[mcu]
# Octopus Pro runs in "USB to CAN bus bridge" mode -> no serial device.
# Find UUID with: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_uuid: 000000000000  # PLACEHOLDER

[printer]
# Z18 head motion is H-bot (both motors drive one belt); Klipper handles
# H-bot with corexy kinematics (config/example-corexy.cfg)
kinematics: corexy
# Conservative limits for testing only
max_velocity: 50
max_accel: 500
max_z_velocity: 5
max_z_accel: 50

# Driver0 slot - H-bot motor labelled "H" on the machine
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40  # PLACEHOLDER - not measured on Z18
endstop_pin: ^PG6  # PLACEHOLDER - Z18 endstops not yet mapped
position_endstop: 0
position_max: 300  # PLACEHOLDER - Z18 spec 300 x 305 x 457 mm, not measured

# Driver1 slot - H-bot motor labelled "V" on the machine
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40  # PLACEHOLDER - not measured on Z18
endstop_pin: ^PG9  # PLACEHOLDER
position_endstop: 0
position_max: 300  # PLACEHOLDER

# Driver2 slot
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8  # PLACEHOLDER - Z18 lead screw pitch not verified
endstop_pin: ^PG10  # PLACEHOLDER
position_endstop: 0
position_max: 450  # PLACEHOLDER

# Driver3 slot: spare TMC5160T, not configured

# TMC5160T Pro V1.0: sense resistor 0.075 ohm, max 3.1 A RMS
# (source: https://global.bttwiki.com/TMC5160T%20Pro%20V1.0.html)
# SPI pins: Octopus Pro v1.1 sample config (TMC2130 section, same SPI wiring)
# run_current: low test values (see docs/hardware.md)

[tmc5160 stepper_x]
cs_pin: PC4
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.35  # PLACEHOLDER - test value; motor type per axis unconfirmed, max 0.8 A (docs/hardware.md)

[tmc5160 stepper_y]
cs_pin: PD11
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.35  # PLACEHOLDER - see stepper_x

[tmc5160 stepper_z]
cs_pin: PC6
spi_bus: spi1
sense_resistor: 0.075
run_current: 0.35  # PLACEHOLDER - Z label inaccessible, same 7.5 ohm coil as H/V, assume max 0.8 A
